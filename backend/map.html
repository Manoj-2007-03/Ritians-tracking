<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Live Map – Ritians Transport</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#060A14;font-family:'DM Sans',sans-serif}

/* ── FULL SCREEN MAP ── */
#map{width:100%;height:100%;position:absolute;inset:0}

/* ── TOP BAR ── */
.top-bar{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;z-index:10;
  background:rgba(6,10,20,0.88);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.13);border-radius:99px;
  padding:8px 14px 8px 8px;box-shadow:0 8px 32px rgba(0,0,0,0.6);
  max-width:calc(100vw - 32px);
}
.back-btn{
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,0.08);border:none;
  color:#F0F4FF;cursor:pointer;font-size:14px;transition:background 0.15s;flex-shrink:0;
}
.back-btn:hover{background:rgba(255,255,255,0.16)}
.vehicle-label{
  font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#F0F4FF;
  white-space:nowrap;
}
.status-pill{
  font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;
  flex-shrink:0;transition:all 0.3s;
}
.status-moving{background:rgba(55,138,221,0.15);color:#7FB4EA;border:1px solid rgba(55,138,221,0.3)}
.status-slow{background:rgba(186,117,23,0.15);color:#F0B65B;border:1px solid rgba(186,117,23,0.3)}
.status-stopped{background:rgba(120,120,116,0.18);color:#B4B2A9;border:1px solid rgba(120,120,116,0.3)}
.status-waiting{background:rgba(90,106,138,0.2);color:#9BAAC8;border:1px solid rgba(90,106,138,0.3)}
.status-offline{background:rgba(239,68,68,0.12);color:#F87171;border:1px solid rgba(239,68,68,0.25)}

/* ── PULSE RING OVERLAY (sits under the marker, added via OverlayView) ── */
.pulse-wrap{position:absolute;width:0;height:0;pointer-events:none}
.pulse-ring{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.pulse-ring.moving{border:2px solid #378ADD;animation:pulseFast 1.4s ease-out infinite}
.pulse-ring.slow{border:2px dashed #BA7517;animation:pulseSlow 2.4s ease-out infinite}
.pulse-ring.stopped{border:1px solid #5F5E5A;width:36px;height:36px;opacity:0.5;animation:none}
.pulse-ring.offline{display:none}
@keyframes pulseFast{0%{width:16px;height:16px;opacity:0.65}100%{width:80px;height:80px;opacity:0}}
@keyframes pulseSlow{0%{width:16px;height:16px;opacity:0.55}100%{width:60px;height:60px;opacity:0}}

/* ── BOTTOM INFO CARD ── */
.info-card{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  background:rgba(6,10,20,0.88);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.13);border-radius:20px;
  padding:16px 20px;z-index:10;
  box-shadow:0 8px 32px rgba(0,0,0,0.6);
  display:flex;gap:20px;flex-wrap:wrap;
  max-width:calc(100vw - 32px);min-width:280px;
}
.info-item{display:flex;flex-direction:column;gap:2px}
.info-item-label{font-size:10px;text-transform:uppercase;letter-spacing:0.07em;color:#5A6A8A;font-weight:600}
.info-item-val{font-family:'DM Mono',monospace;font-size:13px;color:#F0F4FF;font-weight:500}

/* ── SIDE CONTROLS ── */
.side-controls{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:8px;z-index:10;
}
.ctrl-btn{
  width:40px;height:40px;border-radius:12px;
  background:rgba(6,10,20,0.88);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.13);
  display:flex;align-items:center;justify-content:center;
  color:#9BAAC8;cursor:pointer;font-size:14px;
  transition:all 0.15s;box-shadow:0 4px 16px rgba(0,0,0,0.4);
}
.ctrl-btn:hover{background:rgba(26,37,64,0.95);color:#F0F4FF}
.ctrl-btn.active{color:#4ECDC4;border-color:rgba(78,205,196,0.4)}

/* ── LOADING SCREEN ── */
.loading-screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#060A14;z-index:20;gap:16px;
  transition:opacity 0.5s;
}
.loading-screen.hidden{opacity:0;pointer-events:none}
.loading-spinner{
  width:48px;height:48px;border-radius:50%;
  border:3px solid rgba(78,205,196,0.2);
  border-top-color:#4ECDC4;
  animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:#F0F4FF}
.loading-sub{font-size:12px;color:#5A6A8A}

/* ── TOAST ── */
.toast{
  position:absolute;top:80px;left:50%;transform:translateX(-50%);
  background:rgba(26,37,64,0.95);border:1px solid rgba(255,255,255,0.15);
  border-radius:99px;padding:8px 18px;font-size:12px;color:#F0F4FF;
  z-index:15;box-shadow:0 4px 20px rgba(0,0,0,0.5);
  transition:opacity 0.3s;white-space:nowrap;
}
.toast.hidden{opacity:0;pointer-events:none}

@media(max-width:480px){
  .info-card{gap:14px;padding:14px 16px}
  .info-item-val{font-size:12px}
}
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-title">Loading Map…</div>
  <div class="loading-sub" id="loadingSub">Connecting to vehicle</div>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- TOP BAR -->
<div class="top-bar">
  <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
  <div class="vehicle-label" id="vehicleLabel">Bus —</div>
  <div class="status-pill status-waiting" id="statusPill">Connecting…</div>
</div>

<!-- SIDE CONTROLS -->
<div class="side-controls">
  <div class="ctrl-btn" onclick="centerOnVehicle()" title="Center on vehicle">
    <i class="fas fa-crosshairs"></i>
  </div>
  <div class="ctrl-btn" id="satelliteBtn" onclick="toggleSatellite()" title="Toggle satellite">
    <i class="fas fa-layer-group"></i>
  </div>
  <div class="ctrl-btn" onclick="openInGoogleMaps()" title="Open in Google Maps">
    <i class="fas fa-arrow-up-right-from-square"></i>
  </div>
</div>

<!-- BOTTOM INFO CARD -->
<div class="info-card">
  <div class="info-item">
    <div class="info-item-label">Speed</div>
    <div class="info-item-val" id="infoSpeed">— km/h</div>
  </div>
  <div class="info-item">
    <div class="info-item-label">Latitude</div>
    <div class="info-item-val" id="infoLat">—</div>
  </div>
  <div class="info-item">
    <div class="info-item-label">Longitude</div>
    <div class="info-item-val" id="infoLng">—</div>
  </div>
  <div class="info-item">
    <div class="info-item-label">Updated</div>
    <div class="info-item-val" id="infoAgo">—</div>
  </div>
</div>

<!-- TOAST -->
<div class="toast hidden" id="toastEl"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const MAPS_API_KEY = 'AIzaSyAjCI_cdiIGzAGDbRMEOpyXDsjIx9SOObI'; // authorized key
const API_BASE     = window.location.origin;
const POLL_MS      = 3000; // poll every 3 seconds

// Speed thresholds (km/h) for marker state — with small hysteresis to avoid flicker near the edges
const SPEED_STOPPED_ENTER = 2;   // drop to STOPPED once speed <= this
const SPEED_STOPPED_EXIT  = 4;   // only leave STOPPED once speed > this
const SPEED_SLOW_MAX      = 15;  // SLOW band is (stopped-exit .. 15], above that is MOVING
const STALE_MS             = 10000; // no update for this long -> treat as offline regardless of last speed

// ── Read vehicleId from URL ───────────────────────────────────────────────────
const params    = new URLSearchParams(window.location.search);
const vehicleId = params.get('vehicleId');

if (!vehicleId) {
  document.getElementById('loadingSub').textContent = 'No vehicle ID in URL!';
}

document.getElementById('vehicleLabel').textContent = `Bus ${vehicleId || '—'}`;
document.getElementById('loadingSub').textContent   = `Locating Bus ${vehicleId}…`;

// ── Map state ─────────────────────────────────────────────────────────────────
let map, marker, isSatellite = false;
let lastLat = null, lastLng = null;
let pollTimer;
let makeIcon; // defined inside initMap after API loads
let pulseOverlay;
let currentState  = 'waiting'; // moving | slow | stopped | offline
let currentHeading = 0;        // degrees, 0 = north

// ── Derive marker state from speed + staleness, with hysteresis ─────────────
function getMarkerState(speed, isStale, prevState) {
  if (isStale) return 'offline';
  const s = Number(speed) || 0;
  if (prevState === 'stopped') {
    // stay stopped until speed clearly rises above the exit threshold
    if (s <= SPEED_STOPPED_EXIT) return 'stopped';
  } else if (s <= SPEED_STOPPED_ENTER) {
    return 'stopped';
  }
  return s <= SPEED_SLOW_MAX ? 'slow' : 'moving';
}

// ── Bearing between two lat/lng points, in degrees (0 = north, clockwise) ───
function computeHeading(lat1, lng1, lat2, lng2) {
  const toRad = d => d * Math.PI / 180;
  const dLng  = toRad(lng2 - lng1);
  const y = Math.sin(dLng) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
            Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLng);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

// PulseOverlay is a class that extends google.maps.OverlayView — that global doesn't exist
// until the Maps API script (loaded at the bottom of this file) has finished loading, so the
// class itself is defined lazily inside initMap() via this factory, not at top-level script scope.
let PulseOverlay;
function definePulseOverlay() {
  PulseOverlay = class extends google.maps.OverlayView {
    constructor() {
      super();
      this.div = null;
      this.pos = null;
    }
    onAdd() {
      this.div = document.createElement('div');
      this.div.className = 'pulse-wrap';
      this.div.innerHTML = `<div class="pulse-ring stopped"></div>`;
      this.getPanes().overlayLayer.appendChild(this.div);
    }
    draw() {
      if (!this.pos) return;
      const proj = this.getProjection();
      if (!proj) return;
      const point = proj.fromLatLngToDivPixel(this.pos);
      this.div.style.left = `${point.x}px`;
      this.div.style.top  = `${point.y}px`;
    }
    setPosition(pos) {
      this.pos = new google.maps.LatLng(pos.lat, pos.lng);
      this.draw();
    }
    setState(state) {
      const ring = this.div && this.div.querySelector('.pulse-ring');
      if (ring) ring.className = `pulse-ring ${state}`;
    }
    onRemove() {
      if (this.div) { this.div.parentNode.removeChild(this.div); this.div = null; }
    }
  };
}

// ── Dark map style ────────────────────────────────────────────────────────────
const darkStyle = [
  {elementType:'geometry',stylers:[{color:'#0C1220'}]},
  {elementType:'labels.text.stroke',stylers:[{color:'#060A14'}]},
  {elementType:'labels.text.fill',stylers:[{color:'#5A6A8A'}]},
  {featureType:'road',elementType:'geometry',stylers:[{color:'#1A2540'}]},
  {featureType:'road',elementType:'geometry.stroke',stylers:[{color:'#060A14'}]},
  {featureType:'road.highway',elementType:'geometry',stylers:[{color:'#243050'}]},
  {featureType:'water',elementType:'geometry',stylers:[{color:'#060D1A'}]},
  {featureType:'poi',stylers:[{visibility:'off'}]},
  {featureType:'transit',stylers:[{visibility:'off'}]},
];

// ── Init Google Map ───────────────────────────────────────────────────────────
function initMap() {
  // makeIcon must be defined here — google.maps.SymbolPath only available after API loads
  makeIcon = function(color, rotation, showArrow) {
    // Teardrop pin body, with an optional arrowhead drawn on top (only when moving/slow)
    const arrowPath = showArrow
      ? 'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 4l3 6h-2v3h-2v-3H9l3-6z'
      : 'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z';
    return {
      path: arrowPath,
      fillColor: color,
      fillOpacity: 1,
      strokeColor: '#ffffff',
      strokeWeight: 1.5,
      scale: 1.6,
      anchor: new google.maps.Point(12, 22),
      rotation: rotation || 0, // rotates the whole path around the anchor — used to face the heading
    };
  };
  map = new google.maps.Map(document.getElementById('map'), {
    zoom: 15,
    center: { lat: 10.3, lng: 77.9 }, // default center (Tamil Nadu)
    styles: darkStyle,
    disableDefaultUI: true,
    gestureHandling: 'greedy',
  });

  // Custom bus marker (makeIcon called after Maps API loaded)
  marker = new google.maps.Marker({
    map,
    title: `Bus ${vehicleId}`,
    icon: makeIcon('#4ECDC4', 0, false),
    optimized: false,
  });

  // Pulse ring drawn under the marker, reflects moving / slow / stopped / offline
  definePulseOverlay();
  pulseOverlay = new PulseOverlay();
  pulseOverlay.setMap(map);

  // Start polling
  fetchLocation();
  pollTimer = setInterval(fetchLocation, POLL_MS);
}

// ── Fetch location ────────────────────────────────────────────────────────────
async function fetchLocation() {
  if (!vehicleId) return;
  try {
    const res  = await fetch(`${API_BASE}/get-location/${vehicleId}`);
    const data = await res.json();

    if (!data.success) {
      setStatus('offline', 'Vehicle not found');
      updateInfoCard(null);
      return;
    }

    const { lat, lng, speed, isStale, updatedAt } = data;
    const staleByAge = isStale || (Date.now() - updatedAt) > STALE_MS;

    // Heading: only recompute from movement if the bus actually moved a meaningful amount,
    // otherwise keep facing the last known direction instead of jittering on GPS noise.
    if (lastLat !== null && lastLng !== null) {
      const moved = Math.hypot(lat - lastLat, lng - lastLng);
      if (moved > 0.00003) currentHeading = computeHeading(lastLat, lastLng, lat, lng);
    }

    lastLat = lat;
    lastLng = lng;

    const pos = { lat, lng };
    marker.setPosition(pos);
    pulseOverlay.setPosition(pos);

    // Only auto-center first time or when very far off screen
    if (!map.getBounds() || !map.getBounds().contains(pos)) {
      map.panTo(pos);
    }

    // Hide loading screen
    document.getElementById('loadingScreen').classList.add('hidden');

    // Derive state (moving / slow / stopped / offline) with hysteresis, then apply it
    const state = getMarkerState(speed, staleByAge, currentState);
    const labels = { moving: 'Moving', slow: 'Slow', stopped: 'Stopped', offline: 'Offline' };
    setStatus(state, labels[state]);

    // Info card
    updateInfoCard({ lat, lng, speed, updatedAt });

  } catch (e) {
    setStatus('offline', 'Connection error');
  }
}

// ── Update info card ──────────────────────────────────────────────────────────
function updateInfoCard(data) {
  if (!data) {
    document.getElementById('infoSpeed').textContent = '— km/h';
    document.getElementById('infoLat').textContent   = '—';
    document.getElementById('infoLng').textContent   = '—';
    document.getElementById('infoAgo').textContent   = '—';
    return;
  }
  const ago = Math.round((Date.now() - data.updatedAt) / 1000);
  document.getElementById('infoSpeed').textContent = `${data.speed || 0} km/h`;
  document.getElementById('infoLat').textContent   = data.lat.toFixed(5);
  document.getElementById('infoLng').textContent   = data.lng.toFixed(5);
  document.getElementById('infoAgo').textContent   = `${ago}s ago`;
}

// ── Status pill ───────────────────────────────────────────────────────────────
function setStatus(type, text) {
  currentState = type;

  const pill = document.getElementById('statusPill');
  pill.textContent  = text;
  pill.className    = `status-pill status-${type}`;

  // moving = blue with heading arrow, slow = amber with heading arrow, stopped = gray no arrow, offline = red no arrow
  const colors    = { moving:'#378ADD', slow:'#BA7517', stopped:'#5F5E5A', offline:'#EF4444', waiting:'#4ECDC4' };
  const showArrow = (type === 'moving' || type === 'slow');

  if (marker) {
    marker.setIcon(makeIcon(colors[type] || '#4ECDC4', showArrow ? currentHeading : 0, showArrow));
  }
  if (pulseOverlay) {
    pulseOverlay.setState(type);
  }
}

// ── Controls ──────────────────────────────────────────────────────────────────
function centerOnVehicle() {
  if (lastLat !== null) { map.panTo({ lat: lastLat, lng: lastLng }); map.setZoom(16); }
  else showToast('Location not yet received');
}

function toggleSatellite() {
  isSatellite = !isSatellite;
  if (isSatellite) {
    map.setMapTypeId('hybrid');
    map.setOptions({ styles: [] });
  } else {
    map.setMapTypeId('roadmap');
    map.setOptions({ styles: darkStyle });
  }
  document.getElementById('satelliteBtn').classList.toggle('active', isSatellite);
}

function openInGoogleMaps() {
  if (lastLat !== null) {
    window.open(`https://www.google.com/maps?q=${lastLat},${lastLng}`, '_blank');
  } else {
    showToast('Location not yet received');
  }
}

function goBack() {
  clearInterval(pollTimer);
  window.history.length > 1 ? window.history.back() : window.location.href = 'tracking.html';
}

// ── Toast ──────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toastEl');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2500);
}

// ── Load Google Maps API ───────────────────────────────────────────────────────
(function() {
  const s  = document.createElement('script');
  s.src    = `https://maps.googleapis.com/maps/api/js?key=${MAPS_API_KEY}&callback=initMap`;
  s.async  = true;
  s.defer  = true;
  s.onerror = () => {
    document.getElementById('loadingSub').textContent = 'Failed to load Google Maps API';
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
